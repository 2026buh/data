architecture: "resnet18"
num_classes: 2
pretrained: true

transforms:
  rotation: 0
  horizontal_flip: false
  vertical_flip: false
  color_jitter: null
  resize: [224, 224]
  mean: "IMAGENET_MEAN"
  std: "IMAGENET_STD"
  grayscale: false

training_mode: "fine_tune"
batch_size: 8
num_epochs: 1
learning_rate: 0.0001

optimizer: "adam"
optimizer_params:
  weight_decay: 0.0001

loss_function: "cross_entropy"
early_stop_patience: 0
random_seed: 42