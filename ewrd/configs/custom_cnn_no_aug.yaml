architecture: "baseline_cnn"
num_classes: 2
pretrained: false

transforms:
  rotation: 0
  horizontal_flip: false
  vertical_flip: false
  color_jitter: null
  resize: [224, 224]
  mean: "RGB_MEAN_224"
  std: "RGB_STD_224"
  grayscale: false

model_params:
  base_channels: 32
  num_blocks: 4
  dropout: 0.5
  input_channels: 3

training_mode: "fine_tune"

batch_size: 32
num_epochs: 50
learning_rate: 0.001

optimizer: "adam"
optimizer_params:
  weight_decay: 0.0001

loss_function: "cross_entropy"

k_folds: 5
early_stop_patience: 15
random_seed: 42
